name: Build ProfitCalc TJ

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This repository does not commit the binary gradle-wrapper.jar (it can't
      # be produced from source). Instead, we provision Gradle directly and use
      # it to generate a full, correct wrapper matching gradle/wrapper/gradle-wrapper.properties
      # before switching to ./gradlew for every step after this one.
      - name: Provision Gradle and generate the wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate gradlew wrapper files
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests (CalculatorEngine + all business logic)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfitCalc-TJ-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ProfitCalc-TJ-APK-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          
